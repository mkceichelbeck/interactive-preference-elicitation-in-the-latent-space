[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pairwise-bo-core"
version = "0.1.0"
description = "Pairwise Bayesian Optimization core for preference elicitation research"
readme = "README.md"
authors = [
    { name = "Tim Voigt"},
    { name = "Michael Eichelbeck"},
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "botorch>=0.15.0",
    "click>=8.1",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.7",
    "scikit-learn>=1.4",
    "torch>=2.6.0",
    "google-genai>=0.2.0",
    "ollama>=0.4.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ae-train = [
    "tqdm>=4.66",
    "wandb>=0.21",
]

[project.scripts]
pairwise-bo = "pairwise_bo.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
